<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rep HTML Review</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">rep</div>
    <div class="review-state">
      <span class="status" id="status" role="status" aria-live="polite">Loading document…</span>
    </div>
    <div class="actions">
      <button id="discard" type="button">Discard</button>
      <button id="submit" class="primary" type="button">Submit</button>
    </div>
  </header>
  <main class="workspace">
    <iframe id="plan" title="HTML plan under review" sandbox="allow-same-origin" tabindex="-1"></iframe>
    <div
      id="interaction-layer"
      role="application"
      aria-label="HTML plan review surface"
      tabindex="0"
    ></div>
    <aside id="review-hud" class="review-hud" aria-label="Selection controls">
      <span class="mode" id="mode" aria-live="polite">Loading</span>
      <span class="review-hud-divider" aria-hidden="true"></span>
      <span class="review-hud-help"><kbd>?</kbd> Help</span>
    </aside>
  </main>
  <section id="completion" class="completion" hidden>
    <h1>Review complete</h1>
    <p>You can close this tab.</p>
  </section>
  <dialog id="modal" aria-labelledby="modal-title">
    <form id="modal-form" method="dialog">
      <h2 id="modal-title"></h2>
      <div id="modal-content"></div>
      <label id="modal-input-label" for="modal-input" hidden></label>
      <textarea id="modal-input" rows="6" hidden></textarea>
      <div class="modal-actions">
        <button id="modal-cancel" type="button">Cancel</button>
        <button id="modal-confirm" class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rep HTML Review</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">rep</div>
    <div class="review-state">
      <span class="mode" id="mode" hidden></span>
      <span class="status" id="status" role="status" aria-live="polite">Loading document…</span>
    </div>
    <div class="actions">
      <button id="discard" type="button">Discard</button>
      <button id="submit" class="primary" type="button">Submit</button>
    </div>
  </header>
  <main class="workspace">
    <iframe id="plan" title="HTML plan under review" sandbox="allow-same-origin"></iframe>
  </main>
  <section id="completion" class="completion" hidden>
    <h1>Review complete</h1>
    <p>You can close this tab.</p>
  </section>
  <script type="module" src="app.js"></script>
</body>
</html>
